<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TitipDongPak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== TOKEN (palet BLP) ===== */
:root{
  --accent:#973C5A; --accent-ink:#fff; --accent-soft:#FDE4E7; --accent-mid:#C66F86; --accent-line:#F4C7D3;
  --side:#046D6D; --side-on:#75B7B4; --side-soft:#D4EDED; --side-deep:#023F3F;
  --nude:#7F5846; --nude-soft:#FAECDF; --nude-line:#E9CEBB;
  --ink:#2B2326; --muted:#76665E; --line:#EEE0D8; --bg:#FCF8F5; --card:#fff; --sunk:#F6EDE6;
  --ok:#046D6D; --ok-soft:#D4EDED;
  --err:#B3261E; --err-soft:#FDECEA;
  --nav-h:64px; --top-h:56px; --safe:env(safe-area-inset-bottom,0px); --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#EFE6E0;color:var(--ink);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-mid);outline-offset:2px}
[hidden]{display:none!important}
.xs{font-size:12px}.muted{color:var(--muted)}.b{font-weight:800}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ===== LAYOUT ===== */
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);padding-bottom:calc(var(--nav-h) + var(--safe) + 84px)}
.sec-title{font-size:16px;font-weight:800;margin:20px 16px 10px}
.page-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.page-head h1{margin:0;font-size:21px;font-weight:800}

/* ===== TOP BAR: logo + nama (kiri), tombol Admin (kanan) ===== */
.topbar{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 0 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-weight:900;font-size:18px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name span{color:var(--side)}
.admin-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px;color:var(--ink);flex:none}
.admin-btn svg{width:18px;height:18px}
.admin-btn.on{background:var(--side-soft);border-color:var(--side-soft);color:var(--side-deep)}

/* ===== BOTTOM NAV (fixed, selalu di atas konten) ===== */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:50;display:grid;grid-template-columns:repeat(3,1fr);background:var(--side);padding-bottom:var(--safe);box-shadow:0 -2px 14px rgba(4,109,109,.18)}
.nav-btn{position:relative;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--side-soft);font-size:12px;font-weight:700}
.nav-ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:#fff}
.nav-btn[aria-current="page"] .nav-ic{background:var(--side-on);color:var(--side-deep)}
.nav-badge{position:absolute;top:4px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--side);box-sizing:content-box}
body.kb .bottom-nav{display:none}
body.kb .overlay{bottom:0}

/* ===== OVERLAY (halaman di atas tab, nav tetap terlihat) ===== */
.overlay{position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe));margin:0 auto;max-width:480px;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.ov-head{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 6px;background:#fff;border-bottom:1px solid var(--line)}
.ov-head h2{margin:0;font-size:17px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}
.ov-foot{display:flex;gap:10px;padding:10px 16px;background:#fff;border-top:1px solid var(--line)}
.ov-foot .btn{flex:1}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--accent-soft)}
.icon-btn svg{width:24px;height:24px}

/* ===== KOMPONEN ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-okc{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-danger{background:#fff;border-color:var(--err);color:var(--err)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-lg{min-height:52px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:800;padding:0;min-height:44px;font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;flex:none}
.spin.dark{border-color:rgba(0,0,0,.12);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.box{padding:14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:800;white-space:nowrap}
.badge.due{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.hot{background:var(--nude-soft);color:var(--nude)}
.badge.mute{background:var(--sunk);color:var(--muted)}
.badge.sesb{background:var(--nude-soft);color:var(--nude)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tile{position:relative;display:grid;place-items:center;background:var(--nude-soft);border-radius:12px;overflow:hidden;flex:none}
.tile span{line-height:1}
.t40{width:40px;height:40px;font-size:22px;border-radius:10px}
/* foto menu: gambar default (ilustrasi kategori) di latar, foto asli di atasnya */
.pic{position:relative;flex:none;overflow:hidden;border-radius:12px;background-size:cover;background-position:center;background-color:var(--nude-soft)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic img[hidden]{display:none}
.p84{width:84px;height:84px}
.p44{width:44px;height:44px;border-radius:10px}
.p132{width:132px;height:132px;border-radius:16px}
.picbtn{border:0;padding:0;background:none;border-radius:12px;display:block}
.photo-field{display:flex;gap:14px;align-items:flex-start}
.photo-actions{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.photo-actions .btn{justify-content:flex-start}
.dlg-pic{display:block;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:12px;margin:0 0 14px;background-size:cover;background-position:center}
.banner{padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner.info{background:var(--ok-soft);color:var(--side-deep)}
.banner.due{background:var(--accent-soft);color:var(--accent)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.in{padding:2px 0 4px}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:19px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* pilihan tanggal & sesi */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days.in{padding:2px 0 4px}
.day{flex:1 0 92px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:52px}
.day b{font-size:14px;font-weight:800}
.day span{font-size:12px;color:var(--muted);font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.day[aria-pressed="true"] span{color:rgba(255,255,255,.88)}
.sesi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0}
.sesi.in{padding:10px 0 0}
.ses{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;min-height:56px}
.ses svg{width:24px;height:24px;flex:none;color:var(--nude)}
.ses b{display:block;font-size:14.5px;font-weight:800}
.ses span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.ses span.closed{color:var(--err)}
.ses[aria-pressed="true"]{border-color:var(--side);background:var(--side-soft)}
.ses[aria-pressed="true"] svg{color:var(--side)}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;margin:10px 0}
.seg3 button{min-height:36px;border:0;border-radius:10px;background:none;font-weight:800;color:var(--muted);font-size:13px}
.seg3 button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.notice{margin:10px 16px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:700;line-height:1.35}
.notice.info{background:var(--ok-soft);color:var(--side-deep)}
.notice.warn{background:var(--nude-soft);color:var(--nude)}
.notice.err{background:var(--err-soft);color:var(--err)}
.notice.mute{background:var(--sunk);color:var(--muted)}
.notice .btn{flex:none}

/* pengingat bayar */
.due{margin:0 16px 12px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.due svg{width:22px;height:22px;flex:none}
.due-text{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.3}
.due-text b{display:block;font-size:14.5px;font-weight:800}
.due .btn{flex:none}

/* beranda */
.home-head{padding:12px 16px 10px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;height:46px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;height:100%}
.search:focus-within{border-color:var(--accent)}
.groups{display:flex;flex-direction:column;gap:12px;padding:0 16px;margin-top:12px}
.group-card{padding:4px 14px}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.ghead-name{font-weight:800;font-size:15px}
.ghead .gh-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.mrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.mrow:last-child{border-bottom:0}
.mrow-info{flex:1;min-width:0}
.mrow-name{font-weight:800;font-size:15px}
.mrow-desc{font-size:13px;color:var(--muted);margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:800}
.jas{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.mrow-side{display:flex;flex-direction:column;align-items:center;gap:8px;width:88px;flex:none}
.mrow.off .pic{filter:grayscale(1);opacity:.55}
.btn-add{min-height:36px;width:88px;padding:0;border-radius:10px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-weight:800;font-size:13px}
.btn-add:disabled{border-color:var(--line);color:var(--muted);background:var(--sunk)}
.stepper{display:flex;align-items:center;justify-content:space-between;width:88px;height:36px;border-radius:10px;border:1.5px solid var(--accent);background:#fff;flex:none}
.stepper button{width:32px;height:100%;border:0;background:none;color:var(--accent);display:flex;align-items:center;justify-content:center}
.stepper button svg{width:18px;height:18px}
.stepper b{font-size:14px;min-width:18px;text-align:center}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe));margin:0 auto;max-width:480px;padding:8px 12px;z-index:45}
.cartbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:0 16px;border:0;border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(151,60,90,.35);font-size:14.5px;text-align:left}
.cartbtn-l{display:flex;align-items:center;gap:10px;min-width:0}
.cartbtn-l svg{width:22px;height:22px;flex:none}
.cartbtn-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartbtn-l small{display:block;font-size:12px;opacity:.9;font-weight:600}

/* form */
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
.input{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:0;font-size:16px}
textarea.input{min-height:76px;resize:vertical}
select.input{appearance:auto}
.input:focus{border-color:var(--accent)}
.field.bad .input,.field.bad .daypick{border-color:var(--err)}
.ferr{color:var(--err);font-size:12.5px;font-weight:700;margin-top:4px}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.money .input{padding-left:38px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group{margin-bottom:18px}
.group>h3{margin:0 0 8px;font-size:14px;font-weight:800}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.line span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow-info{flex:1;min-width:0}
.crow-name{font-weight:700}
.when{display:flex;align-items:center;gap:12px;padding:12px 14px}
.when svg{width:22px;height:22px;color:var(--accent);flex:none}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;border:1.5px solid transparent;border-radius:12px}
.daypick.two{grid-template-columns:1fr 1fr}
.daypick button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13px;padding:0}
.daypick button[aria-pressed="true"]{background:var(--side);border-color:var(--side);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.switch span{font-weight:700;font-size:14px}
.switch small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#D9CCC4;position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--side)}
.switch input:checked::after{left:21px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;cursor:pointer}
.opt input{accent-color:var(--side);width:20px;height:20px;margin:1px 0 0;flex:none}
.opt.on{border-color:var(--side);background:var(--side-soft)}
.field>label.opt{display:flex;font-size:inherit;margin-bottom:8px}
.opt>span>span{display:block}
.opt b{display:block;font-size:14px}
.opt span{font-size:12.5px;color:var(--muted);font-weight:600}

/* pesanan */
.olist{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.ocard{padding:14px}
.ocard-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ocard-name{font-weight:800;font-size:15.5px}
.ocard-items{margin:8px 0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ocard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.ocard-foot .acts{display:flex;gap:8px;flex-wrap:wrap}
.ocard .note-bad{margin-top:8px;font-size:13px;font-weight:700;color:var(--err)}
.empty{text-align:center;padding:40px 28px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:17px}
.empty p{margin:0 0 16px}
.track{list-style:none;margin:8px 0 4px;padding:0;display:grid;grid-template-columns:repeat(2,1fr)}
.track li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding:0 2px}
.track li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.track li:first-child::before{display:none}
.track li.done::before{background:var(--ok)}
.track .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.track .dot svg{width:15px;height:15px}
.track li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.track li.now .dot{border-color:var(--accent);color:var(--accent)}
.track li.now,.track li.done{color:var(--ink)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-title h3{margin:0;font-size:15px;font-weight:800}
.step-h{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-weight:800;font-size:14px}
.step-h i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:12px;flex:none}
.qris-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;border:1.5px dashed var(--nude-line);border-radius:14px;background:#fff}
.qris-box img{display:block;width:100%;max-width:260px;height:auto;border-radius:8px;background:#fff}
.qris-box .xs{text-align:center}
.paybox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1.5px dashed var(--nude-line);border-radius:12px;padding:10px 12px;margin-top:10px}
.paybox div{font-size:14px;font-weight:700;white-space:pre-wrap;word-break:break-word;min-width:0}
.paybox .lbl{display:block;font-size:12px;color:var(--muted);font-weight:600}
.paytext{margin:10px 0 0;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .grow{flex:1}

/* akun */
.profile{display:flex;align-items:center;gap:14px;padding:16px;margin:0 16px 16px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 16px}
.stat{padding:12px 14px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.pad-form{padding:0 16px}
.acc-card{margin:18px 16px 0;padding:16px}
.acc-card h2{margin:0 0 4px;font-size:16px;font-weight:800}
.acc-card p{margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;margin:12px 0}
.seg button{min-height:38px;border:0;border-radius:10px;background:none;font-weight:800;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps{margin:4px 0 0;padding-left:22px}
.steps li{margin:7px 0;font-size:14px}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;background:var(--sunk);font-weight:800;font-size:13px;white-space:nowrap}
.kbd svg{width:14px;height:14px}
.urlbox{display:flex;gap:8px;align-items:center;margin-top:12px}
.urlbox input{flex:1;min-width:0;font-size:13px;min-height:42px}

/* admin */
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.acard{padding:14px}
.acard .who{font-weight:800;font-size:15px}
.acard .meta2{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
.acard ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.acard ul li{margin:2px 0}
.shop-card{padding:12px 14px}
.shop-card h3{display:flex;justify-content:space-between;gap:10px;margin:0 0 6px;font-size:15px}
.set-card{padding:14px;display:flex;gap:12px;align-items:flex-start}
.set-card dl{margin:0;flex:1;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;min-width:0}
.set-card dt{color:var(--muted);font-weight:600}
.set-card dd{margin:0;font-weight:700;word-break:break-word}
.tcard{padding:4px 14px 12px}
.tcard.inactive .ghead{opacity:.6}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.mitem:last-of-type{border-bottom:0}
.mitem-body{flex:1;min-width:0}
.mitem-name{font-weight:800;font-size:14.5px}
.mitem-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.dchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.dchip{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--side-soft);color:var(--side)}
.dchip.s{background:var(--nude-soft);color:var(--nude)}
.mitem .chev{width:18px;height:18px;color:var(--muted);flex:none}
.add-row{display:flex;gap:8px;margin-top:10px}
.qris-thumb{width:120px;height:120px;border-radius:12px;border:1px solid var(--line);background:#fff;object-fit:contain;flex:none}
.qris-empty{width:120px;height:120px;border-radius:12px;border:1.5px dashed var(--nude-line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:8px;flex:none}

/* skeleton & toast & dialog */
.sk{background:linear-gradient(90deg,#F1E7E1 25%,#F9F3EF 37%,#F1E7E1 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe) + 76px);transform:translate(-50%,12px);max-width:calc(100% - 32px);width:max-content;z-index:95;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--err)}
body.kb .toast{bottom:24px}
.dlg{position:fixed;inset:0;z-index:90;background:rgba(43,35,38,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg-card{background:#fff;border-radius:18px;padding:20px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.dlg-card h3{margin:0 0 6px;font-size:17px}
.dlg-card p{margin:0 0 14px;color:var(--muted)}
.dlg-img{display:block;max-width:100%;max-height:52vh;margin:0 auto 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.dlg-actions{display:flex;gap:10px}
.dlg-actions .btn{flex:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function cropSquare(file) {
  return loadImage(file).then(function (img) {
    var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h), sx = (w - s) / 2, sy = (h - s) / 2;
    var sizes = [480, 400, 320, 260], qs = [0.8, 0.7, 0.6, 0.5];
    for (var i = 0; i < sizes.length; i++) {
      var cv = document.createElement('canvas'), z = Math.min(sizes[i], s);

      cx.drawImage(img, sx, sy, s, s, 0, 0, z, z);
      for (var j = 0; j < qs.length; j++) {

function compressProof(file) {
  var lim = S.config.compress || { px: 1280, kb: 250 };
  return loadImage(file).then(function (img) {
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = Math.min(1, lim.px / Math.max(w, h));
    var best = null;
    for (var round = 0; round < 5; round++) {
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * scale)); cv.height = Math.max(1, Math.round(h * scale));
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      var qs = [0.85, 0.75, 0.65, 0.55, 0.45];
      for (var i = 0; i < qs.length; i++) {
        var d = cv.toDataURL('image/jpeg', qs[i]);
        best = d;
        if (dataBytes(d) <= lim.kb * 1024) return d;
      }
      scale *= 0.8;
    }

  });
}
// QRIS dari admin: tetap tajam agar bisa dipindai (PNG bila kecil, selain itu JPEG kualitas tinggi).
function prepQris(file) {
  return loadImage(file).then(function (img) {
    var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, 1100 / Math.max(w, h));
    var cv = document.createElement('canvas');
    cv.width = Math.round(w * s); cv.height = Math.round(h * s);
    var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    var png = cv.toDataURL('image/png');

}

// Pengingat di Beranda: pesanan yang belum dibayar.
function renderDue() {
  var el = $('#dueBox'); if (!el) return;
  var due = unpaidOrders();
  if (!due.length) { el.innerHTML = ''; return; }
  var sum = due.reduce(function (n, o) { return n + o.total; }, 0);
  var one = due.length === 1;
  el.innerHTML = '<div class="due" role="status">' + ICON.wallet +
    '<div class="due-text"><b>' + (one ? 'Pesanan belum dibayar' : due.length + ' pesanan belum dibayar') + '</b>' +
    (one ? esc(sesLabel(due[0].session)) + ' · ' + esc(dayLabel(due[0].date)) + ' · ' : 'Total ') + rp(sum) + '</div>' +
    (one ? '<button class="btn btn-sm btn-primary" data-act="openOrder" data-id="' + esc(due[0].id) + '">Bayar</button>'
         : '<button class="btn btn-sm btn-primary" data-act="goUnpaid">Lihat</button>') + '</div>';
}
function renderNotice() {
  var el = $('#dayNotice'); if (!el) return;
  var ds = S.date, sess = S.sess, st = orderState(ds, sess), s = sesInfo(sess), html = '';
  if (!itemsFor(ds, sess).length) { el.innerHTML = ''; return; }
  if (st.reason === 'past') {
    html = '<div class="notice mute">' + esc(dayFull(ds)) + ' sudah lewat. Menu hanya bisa dilihat.</div>';
  } else if (st.reason === 'cutoff') {
    var next = firstOpen(), btn = '';
    if (next.date !== ds || next.sess !== sess) btn = '<button class="btn btn-sm" data-act="goOpen">Pesan ' + esc(sesLabel(next.sess)) + (next.date !== ds ? ' besok' : '') + '</button>';
    html = '<div class="notice err"><span>Pesanan ' + esc(s.label) + ' hari ini ditutup pukul ' + esc(s.cutoff) + '.</span>' + btn + '</div>';
  } else if (ds === S.cal.today) {
    html = '<div class="notice warn">' + (s.cutoff ? 'Pesan menu ' + esc(s.label) + ' paling lambat pukul ' + esc(s.cutoff) + '.' : 'Pesanan ' + esc(s.label) + ' untuk hari ini.') + '</div>';
  } else {
    html = '<div class="notice info">Pre-order ' + esc(s.label) + ' untuk ' + esc(dayLong(ds)) + '.</div>';
  }
  el.innerHTML = html;
}
function renderChips() {
  var el = $('#catChips'); if (!el) return;
  var seen = {}, cats = ['Semua'];
  itemsFor(S.date, S.sess).forEach(function (i) { if (!seen[i.category]) { seen[i.category] = 1; cats.push(i.category); } });
  if (cats.indexOf(S.cat) < 0) S.cat = 'Semua';
  el.hidden = cats.length < 3;
  el.innerHTML = cats.map(function (c) {
    return '<button class="chip" data-act="cat" data-cat="' + esc(c) + '" aria-pressed="' + (S.cat === c) + '">' + esc(c) + '</button>';
  }).join('');
}
function renderMenuList() {
  var el = $('#menuList'); if (!el) return;
  var ds = S.date, sess = S.sess, all = itemsFor(ds, sess);
  if (!all.length) {
    el.innerHTML = '<div class="empty"><div class="big">🗓️</div><h3>Tidak ada menu ' + esc(sesLabel(sess)) + '</h3><p>Belum ada menu ' + esc(sesLabel(sess).toLowerCase()) + ' untuk ' + esc(WEEKDAYS[weekday(ds)]) + '. Pilih sesi atau tanggal lain.</p></div>';
    return;
  }
  var q = S.q.trim().toLowerCase();
  var items = all.filter(function (i) {
    if (S.cat !== 'Semua' && i.category !== S.cat) return false;
    if (!q) return true;
    var m = S.merMap[i.merchantId];
    return (i.name + ' ' + i.desc + ' ' + m.name).toLowerCase().indexOf(q) > -1;
  });
  if (!items.length) {
    el.innerHTML = '<div class="empty"><div class="big">🔍</div><h3>Tidak ada hasil</h3><p>Coba kata kunci lain atau pilih kategori Semua.</p></div>';
    return;
  }
  var order = [], groups = {};
  items.forEach(function (i) {
    if (!groups[i.merchantId]) { groups[i.merchantId] = []; order.push(i.merchantId); }
    groups[i.merchantId].push(i);
  });
  var canOrder = orderState(ds, sess).ok;
  el.innerHTML = '<div class="groups">' + order.map(function (mid) {
    var m = S.merMap[mid];
    return '<section class="card group-card" aria-label="' + esc(m.name) + '"><div class="ghead">' + tile(m.emoji, 't40') +
      '<div><div class="ghead-name">' + esc(m.name) + '</div>' + (m.desc ? '<div class="xs muted">' + esc(m.desc) + '</div>' : '') + '</div></div>' +
      groups[mid].map(function (i) { return itemRow(i, ds, sess, canOrder, m); }).join('') + '</section>';
  }).join('') + '</div>';
}
function itemRow(i, ds, sess, canOrder, m) {
  var n = qtyOf(ds, sess, i.id), off = !i.available || !m.open, ctl = '';
  if (!i.available) ctl = '<button class="btn-add" disabled>Habis</button>';
  else if (!m.open) ctl = '<button class="btn-add" disabled>Tutup</button>';
  else if (!canOrder) ctl = '';
  else if (n > 0) ctl = '<div class="stepper"><button data-act="dec" data-id="' + esc(i.id) + '" aria-label="Kurangi ' + esc(i.name) + '">' + ICON.minus + '</button><b aria-live="polite">' + n + '</b><button data-act="inc" data-id="' + esc(i.id) + '" aria-label="Tambah ' + esc(i.name) + '">' + ICON.plus + '</button></div>';
  else ctl = '<button class="btn-add" data-act="inc" data-id="' + esc(i.id) + '" aria-label="Tambah ' + esc(i.name) + '">Tambah</button>';
  return '<div class="mrow' + (off ? ' off' : '') + '"><div class="mrow-info">' +
    '<div class="mrow-name">' + esc(i.name) + (i.popular ? ' <span class="badge hot">Terlaris</span>' : '') + '</div>' +
    (i.desc ? '<div class="mrow-desc">' + esc(i.desc) + '</div>' : '') +
    '<div class="price num">' + rp(i.price) + '</div>' + jastipNote(i.jastip, i) + '</div>' +
    '<div class="mrow-side">' + (photoSrc(i) || i.photoV
      ? '<button class="picbtn" data-act="viewPic" data-id="' + esc(i.id) + '" aria-label="Lihat foto ' + esc(i.name) + '">' + picHTML(i, 'p84') + '</button>'
      : picHTML(i, 'p84')) + ctl + '</div></div>';
}
function setDate(ds) {
  if (S.cal.days.indexOf(ds) < 0) return;
  S.date = ds; ssSet('santap_date', ds);
  if (S.tab !== 'home') switchTab('home');
  renderHome(); updateCartBar();
}
function setSess(k) {
  if (sesKeys().indexOf(k) < 0) return;
  S.sess = k; ssSet('tdp_sess', k);
  renderHome(); updateCartBar();
}

/* ===== CHECKOUT ===== */
function openCheckout() {
  var ds = S.date, sess = S.sess;
  if (!cartLines(ds).length) { toast('Keranjang masih kosong'); return; }
  var st = orderState(ds, sess);
  if (!st.ok) { toast(ERR.DATE_CLOSED({ reason: st.reason, session: sess, cutoff: sesInfo(sess).cutoff }), 'err'); return; }
  var f = S.form, u = S.user;
  if (!f.name) f.name = u.name || '';
  if (!f.phone) f.phone = u.phone || '';
  S.formErr = {};
  renderCheckout(false);
  pushOv('ovCheckout');
}
function fieldHTML(id, label, input, key, errs) {
  var bad = (errs || S.formErr)[key];
  return '<div class="field' + (bad ? ' bad' : '') + '"><label for="' + id + '">' + label + '</label>' + input +
    (bad ? '<div class="ferr">' + esc(bad) + '</div>' : '') + '</div>';
}
function breakdown(t) {
  var c = S.config;
  return '<div class="line"><span>Subtotal makanan</span><span>' + rp(t.sub) + '</span></div>' +
    (t.jas > 0 ? '<div class="line"><span>Biaya jastip' + (t.n ? ' (' + t.n + ' porsi)' : '') + '</span><span>' + rp(t.jas) + '</span></div>' : '') +
    (t.tax > 0 ? '<div class="line"><span>Pajak' + (c.taxPct ? ' ' + c.taxPct + '%' : '') + ' (menu kena pajak)</span><span>' + rp(t.tax) + '</span></div>' : '') +
    (t.ship > 0 ? '<div class="line"><span>Ongkos kirim</span><span>' + rp(t.ship) + '</span></div>' : '') +
    (t.svc > 0 ? '<div class="line"><span>Biaya layanan</span><span>' + rp(t.svc) + '</span></div>' : '') +
    '<div class="line total"><span>Total bayar</span><span>' + rp(t.total) + '</span></div>';
}
function renderCheckout(keepScroll) {
  var el = $('#ovCheckout'), ds = S.date, sess = S.sess;
  var prev = keepScroll ? ($('.ov-body', el) || {}).scrollTop : 0;
  var t = totals(ds), f = S.form;
  var lines = cartLines(ds).map(function (l) {
    var it = S.menuMap[l.id], m = S.merMap[it.merchantId];
    return '<div class="crow">' + picHTML(it, 'p44') + '<div class="crow-info"><div class="crow-name">' + esc(it.name) + '</div>' +
      '<div class="xs muted">' + esc(m ? m.name : '') + ' · ' + rp(it.price) + (it.jastip > 0 ? ' + jastip ' + rp(it.jastip) : '') + (it.taxable && S.config.taxOn ? ' · kena pajak' : '') + '</div></div>' +
      '<div class="stepper"><button data-act="dec" data-id="' + esc(l.id) + '" aria-label="Kurangi ' + esc(it.name) + '">' + ICON.minus + '</button><b>' + l.qty + '</b><button data-act="inc" data-id="' + esc(l.id) + '" aria-label="Tambah ' + esc(it.name) + '">' + ICON.plus + '</button></div></div>';
  }).join('');
  var belowMin = S.config.minOrder > 0 && t.sub < S.config.minOrder;
  var s = sesInfo(sess);
  var body =
    '<div class="card when group">' + ICON.cal + '<div><div class="xs muted">Sesi ' + esc(s.label) + (ds === S.cal.today && s.cutoff ? ' · tutup ' + esc(s.cutoff) : '') + '</div><div class="b">' + esc(dayFull(ds)) + '</div></div></div>' +
    '<div class="group"><h3>Pesananmu</h3><div class="card" style="padding:4px 14px">' + lines + '</div>' +
      '<button class="btn btn-sm" style="margin-top:10px" data-act="addMore">+ Tambah menu lain</button></div>' +
    (belowMin ? '<div class="banner due" style="margin-bottom:16px">Minimum pesanan ' + rp(S.config.minOrder) + '. Tambah ' + rp(S.config.minOrder - t.sub) + ' lagi.</div>' : '') +
    '<div class="group"><h3>Pemesan</h3><div class="row2">' +
      fieldHTML('fName', 'Nama', '<input class="input" id="fName" data-form="name" autocomplete="name" maxlength="60" value="' + esc(f.name) + '">', 'name') +
      fieldHTML('fPhone', 'Nomor HP', '<input class="input" id="fPhone" data-form="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="0812…" value="' + esc(f.phone) + '">', 'phone') +
    '</div></div>' +
    '<div class="group"><h3>Catatan (opsional)</h3><textarea class="input" id="fNote" data-form="note" maxlength="200" aria-label="Catatan" placeholder="Contoh: sambal dipisah, tidak pakai bawang">' + esc(f.note) + '</textarea></div>' +
    '<div class="group"><h3>Rincian</h3><div class="card box">' + breakdown(t) + '</div></div>' +
    '<div class="banner info">Setelah pesan, bayar lewat QRIS lalu upload bukti bayar. Status langsung Lunas.</div>';
  el.innerHTML = '<div class="ov-head"><button class="icon-btn" data-act="back" aria-label="Kembali">' + ICON.back + '</button><h2>Keranjang · ' + esc(s.label) + '</h2></div>' +
    '<div class="ov-body">' + body + '</div>' +
    '<div class="ov-foot"><button class="btn btn-primary btn-lg" id="placeBtn" data-act="place"' + (S.placing ? ' disabled' : '') + '>' +
    (S.placing ? '<span class="spin"></span> Mengirim…' : 'Pesan · ' + rp(t.total)) + '</button></div>';
  if (keepScroll) { var b = $('.ov-body', el); if (b) b.scrollTop = prev; }
}
function validateForm() {
  var f = S.form, e = {};
  if (!f.name.trim()) e.name = 'Nama wajib diisi.';
  var ph = f.phone.replace(/[^\d+]/g, '');
  if (!ph) e.phone = 'Nomor HP wajib diisi.';
  else if (!/^\+?\d{8,15}$/.test(ph)) e.phone = 'Nomor HP tidak valid.';
  S.formErr = e;
  return Object.keys(e).length === 0;
}
function placeOrder() {
  if (S.placing) return;
  var ds = S.date, sess = S.sess, t = totals(ds);
  var st = orderState(ds, sess);
  if (!st.ok) { toast(ERR.DATE_CLOSED({ reason: st.reason, session: sess, cutoff: sesInfo(sess).cutoff }), 'err'); return; }
  if (S.config.minOrder > 0 && t.sub < S.config.minOrder) { toast(ERR.MIN_ORDER({ min: S.config.minOrder }), 'err'); return; }
  if (!validateForm()) {
    renderCheckout(true);
    var first = $('.field.bad .input', $('#ovCheckout')); if (first) first.focus();
    return;
  }
  var f = S.form;
  var payload = {
    date: ds, session: sess,
    items: cartLines(ds).map(function (l) { return { menuId: l.id, qty: l.qty }; }),
    name: f.name.trim(), phone: f.phone.replace(/[^\d+]/g, ''), note: f.note.trim(),
    expectedTotal: t.total
  };
  S.placing = true; renderCheckout(true);
  api('apiPlaceOrder', S.deviceId, payload).then(function (r) {
    S.placing = false;
    if (!r || !r.ok) {
      renderCheckout(true);
      toast(errText(r), 'err');
      if (r && /^(ITEM_UNAVAILABLE|MERCHANT_CLOSED|PRICE_CHANGED|DATE_CLOSED)$/.test(r.code)) reloadAll(true);
      return;
    }
    S.orders.unshift(r.order);
    S.user = { name: payload.name, phone: payload.phone };
    S.form.note = ''; ssDel('santap_draft');
    delete S.carts[ck(ds, sess)]; saveCarts();
    S.orderDate = r.order.date;
    switchTab('orders');
    openOrder(r.order.id);
    updateBadge();
    toast('Pesanan tersimpan. Bayar lewat QRIS lalu upload buktinya.');
  }).catch(function () {
    S.placing = false; renderCheckout(true);
    toast('Koneksi bermasalah. Pesanan belum terkirim, coba lagi.', 'err');
  });
}

/* ===== PESANAN ===== */
function orderById(id) { for (var i = 0; i < S.orders.length; i++) if (S.orders[i].id === id) return S.orders[i]; return null; }
function replaceOrder(o) {
  for (var i = 0; i < S.orders.length; i++) if (S.orders[i].id === o.id) { S.orders[i] = o; return; }
}
function updateBadge() {
  var n = unpaidOrders().length;
  var b = $('#navBadge'); b.hidden = n === 0; b.textContent = n;
  b.setAttribute('aria-label', n + ' pesanan belum dibayar');
}
function merchantsOf(o) {
  if (o.merchantName) return o.merchantName;
  var names = [];
  o.items.forEach(function (i) { if (i.merchantName && names.indexOf(i.merchantName) < 0) names.push(i.merchantName); });
  return names.join(', ') || 'Pesanan';
}
function renderOrders() {
  var v = $('#v-orders');
  var counts = { all: S.orders.length };
  S.cal.days.forEach(function (ds) { counts[ds] = S.orders.filter(function (o) { return o.date === ds; }).length; });
  var keys = S.cal.days.concat(['all']);
  if (keys.indexOf(S.orderDate) < 0) S.orderDate = S.cal.today;
  var list = S.orderDate === 'all' ? S.orders : S.orders.filter(function (o) { return o.date === S.orderDate; });
  list = list.slice().sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    if (a.session !== b.session) return sesKeys().indexOf(a.session) - sesKeys().indexOf(b.session);
    return a.time < b.time ? 1 : -1;
  });
  var body;
  if (!list.length) {
    var canOrder = S.orderDate !== 'all' && sesKeys().some(function (k) { return orderState(S.orderDate, k).ok; });
    body = '<div class="empty"><div class="big">🧾</div><h3>Belum ada pesanan' + (S.orderDate === 'all' ? '' : ' ' + esc(dayLabel(S.orderDate).toLowerCase())) + '</h3>' +
      '<p>' + (canOrder ? 'Lihat menu ' + esc(dayLong(S.orderDate)) + ' dan pesan sekarang.' : 'Pesanan yang kamu buat akan muncul di sini.') + '</p>' +
      (canOrder ? '<button class="btn btn-primary" data-act="day" data-date="' + S.orderDate + '">Lihat menu</button>' : '') + '</div>';
  } else {
    body = '<div class="olist">' + list.map(function (o) {
      var sum = o.items.map(function (i) { return i.qty + '× ' + i.name; }).join(', ');
      var due = o.status === 'Belum Bayar';
      return '<article class="card ocard">' +
        '<div class="ocard-top"><div style="min-width:0"><div class="ocard-name">' + esc(merchantsOf(o)) + '</div><div class="xs muted">' + esc(dayFull(o.date)) + ' · ' + esc(o.id) + '</div></div>' +
        '<div class="badges">' + sesBadge(o.session) + badge(o.status) + '</div></div>' +
        '<div class="ocard-items">' + esc(sum) + '</div>' +
        (due && o.adminNote ? '<div class="note-bad">Admin: ' + esc(o.adminNote) + '</div>' : '') +
        '<div class="ocard-foot"><span class="price num">' + rp(o.total) + '</span><span class="acts">' +
        (due ? '<button class="btn btn-sm btn-primary" data-act="openOrder" data-id="' + esc(o.id) + '">' + ICON.wallet + ' Bayar</button>'
             : '<button class="btn btn-sm" data-act="openOrder" data-id="' + esc(o.id) + '">Detail</button>') +
        (o.status !== 'Belum Bayar' ? '<button class="btn btn-sm" data-act="reorder" data-id="' + esc(o.id) + '">Pesan lagi</button>' : '') +
        '</span></div></article>';
    }).join('') + '</div>';
  }
  v.innerHTML = '<div class="page-head"><h1>Pesanan</h1><button class="icon-btn" data-act="refreshOrders" aria-label="Muat ulang pesanan">' + ICON.refresh + '</button></div>' +
    '<div class="days" role="group" aria-label="Tanggal pesanan" style="margin-bottom:12px">' + dayButtons(keys, S.orderDate, 'orderDate', counts) + '</div>' + body;
  updateBadge();
}
function openOrder(id) {
  if (!orderById(id)) return;
  S.openOrderId = id;
  renderOrderDetail();
  pushOv('ovOrder');
}
function tracker(o) {
  if (o.status === 'Dibatalkan') return '<div class="banner err" style="margin-top:8px">Pesanan dibatalkan</div>';
  var paid = o.status === 'Lunas';
  return '<ol class="track" aria-label="Status pembayaran">' +
    '<li class="' + (paid ? 'done' : 'now') + '"' + (paid ? '' : ' aria-current="step"') + '><span class="dot">' + (paid ? ICON.check : '1') + '</span><span>Belum Bayar</span></li>' +
    '<li class="' + (paid ? 'done' : '') + '"' + (paid ? ' aria-current="step"' : '') + '><span class="dot">' + (paid ? ICON.check : '2') + '</span><span>Lunas</span></li></ol>';
}
function qrisBlock() {
  if (!S.config.qrisV) return '<div class="qris-box"><p class="xs muted" style="margin:0">QRIS belum diupload admin. Hubungi admin untuk info pembayaran.</p></div>';
  if (!qrisReady()) { loadQris(); return '<div class="qris-box"><div class="spin dark" style="width:24px;height:24px"></div><p class="xs muted" style="margin:0">Memuat QRIS…</p></div>'; }
  return '<div class="qris-box"><img src="' + esc(S.qris.d) + '" alt="Kode QRIS pembayaran">' +
    '<p class="xs muted" style="margin:0">Scan dari HP lain, atau tekan lama gambar lalu simpan, kemudian buka dari aplikasi e-wallet / m-banking.</p>' +
    '<a class="btn btn-sm" href="' + esc(S.qris.d) + '" download="QRIS-' + esc(S.config.appName) + (/png/.test(S.qris.d.slice(0, 20)) ? '.png' : '.jpg') + '">' + ICON.download + ' Simpan gambar QRIS</a></div>';
}
function paySection(o) {
  var c = S.config, html = '<div class="card-title"><h3>Pembayaran QRIS</h3>' + badge(o.status) + '</div>' + tracker(o);
  if (o.status === 'Belum Bayar') {
    var busy = S.uploading === o.id;
    if (o.adminNote) html += '<div class="banner err" style="margin-top:10px">Admin: ' + esc(o.adminNote) + '. Upload ulang bukti yang benar.</div>';
    html += '<div class="step-h"><i>1</i>Bayar dengan QRIS</div>' + qrisBlock() +
      '<div class="paybox"><div><span class="lbl">Total bayar</span>' + rp(o.total) + '</div><button class="btn btn-sm" data-act="copyAmt" data-id="' + esc(o.id) + '">Salin</button></div>' +
      (c.payInfo ? '<p class="paytext muted">' + esc(c.payInfo) + '</p>' : '') +
      '<div class="step-h"><i>2</i>Upload bukti bayar</div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-act="upload" data-id="' + esc(o.id) + '"' + (busy ? ' disabled' : '') + '>' +
      (busy ? '<span class="spin"></span> Mengunggah…' : ICON.upload + ' Upload bukti bayar') + '</button>' +
      '<p class="xs muted" style="margin:8px 0 0">Foto dikompres otomatis sebelum dikirim. Setelah terkirim, status langsung Lunas.</p>';
  } else if (o.status === 'Lunas') {
    html += '<p class="paytext"><b>Lunas.</b> ' + (o.proofTime ? 'Bukti bayar dikirim ' + esc(fmtTime(o.proofTime)) + '.' : 'Pembayaran sudah dicatat admin.') + '</p>';
    if (o.hasProof) html += '<div class="actions"><button class="btn btn-sm" data-act="viewProof" data-id="' + esc(o.id) + '">' + ICON.img + ' Lihat bukti bayar</button></div>';
  } else {
    html += '<p class="paytext muted">Pesanan ini dibatalkan.</p>';
  }
  return '<div class="card box group">' + html + '</div>';
}
function canCancel(o) { return o.status === 'Belum Bayar' && o.date >= S.cal.today; }
function renderOrderDetail() {
  var o = orderById(S.openOrderId); if (!o) return;
  var el = $('#ovOrder'), prev = ($('.ov-body', el) || {}).scrollTop || 0;
  var items = o.items.map(function (i) {
    return '<div class="line"><span>' + i.qty + '× ' + esc(i.name) + (i.merchantName ? '<span class="jas">' + esc(i.merchantName) + (i.jastip ? ' · jastip ' + rp(i.jastip) + '/porsi' : '') + (i.taxable && o.tax ? ' · kena pajak' : '') + '</span>' : '') + '</span><span>' + rp(i.price * i.qty) + '</span></div>';
  }).join('');
  var t = { sub: o.subtotal, jas: o.jastip, n: o.items.reduce(function (n, i) { return n + i.qty; }, 0), tax: o.tax, ship: o.deliveryFee, svc: o.serviceFee, total: o.total };
  var foot = canCancel(o)

function startUpload(id) {

function onProofPicked(file) {
  var id = S.uploadFor; S.uploadFor = null;

  if (file.type && !/^image\//.test(file.type)) { toast(ERR.PROOF_INVALID, 'err'); return; }
  if (file.size > 25 * 1024 * 1024) { toast('Foto lebih dari 25 MB. Pilih foto lain atau screenshot.', 'err'); return; }
  compressProof(file).then(function (dataUrl) {
    var o = orderById(id);
    return dialog({
      title: 'Kirim bukti bayar ini?',
      html: '<img class="dlg-img" src="' + dataUrl + '" alt="Pratinjau bukti bayar"><p>Ukuran ' + kb(file.size) + ' → <b>' + kb(dataBytes(dataUrl)) + '</b> setelah dikompres. Pastikan nominal ' + rp(o ? o.total : 0) + ' terlihat jelas.</p>',
      ok: 'Kirim', cancel: 'Pilih ulang'
    }).then(function (d) {

        replaceOrder(r.order); S.proofs[id] = dataUrl;

      }, function () { S.uploading = null; rerenderOrderViews(); toast('Upload gagal. Periksa koneksi lalu coba lagi.', 'err'); });
    });
  }).catch(function () { toast('Foto tidak bisa dibaca. Pilih gambar JPG atau PNG.', 'err'); });
}
function viewProof(id) {
  var show = function (src) { dialog({ title: 'Bukti bayar ' + id, html: '<img class="dlg-img" src="' + src + '" alt="Bukti bayar">', ok: 'Tutup', cancel: null }); };
  if (S.proofs[id]) { show(S.proofs[id]); return; }
  toast('Memuat bukti bayar…');
  api('apiGetProof', S.deviceId, S.adminPin, id).then(function (r) {
    if (!r || !r.ok) { toast(errText(r), 'err'); return; }
    S.proofs[id] = r.dataUrl; show(r.dataUrl);
  }).catch(function () { toast('Gagal memuat gambar', 'err'); });
}
function copyText(text, okMsg) {
  var done = function () { toast(okMsg || 'Disalin'); };
  var bad = function () { toast('Tidak bisa menyalin. Tekan lama teksnya untuk menyalin.', 'err'); };
  try {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text) ? done() : bad(); });
  } catch (e) { fallbackCopy(text) ? done() : bad(); }
}
function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}

function saveForm() {
  if (S.saving) return;
  readFormInputs();
  var E = S.edit, d = E.data, e = {}, call, payload, msg;
  if (E.type === 'merchant') {
    if (!d.name.trim()) e.name = 'Nama tenant wajib diisi.';
    payload = { id: d.id || '', name: d.name.trim(), emoji: d.emoji.trim(), desc: d.desc.trim(), active: !!d.active, taxable: !!d.taxable };
    call = 'apiAdminSaveMerchant'; msg = d.id ? 'Tenant disimpan' : 'Tenant ditambahkan';
  } else if (E.type === 'menu') {
    var price = digits(d.price), jas = digits(d.jastip);
    if (!d.name.trim()) e.name = 'Nama menu wajib diisi.';
    if (price === '') e.price = 'Harga wajib diisi.';
    if (!d.days.length) e.days = ERR.DAYS_REQUIRED;
    if (!d.sessions.length) e.sessions = ERR.SESSION_REQUIRED;
    payload = { id: d.id || '', merchantId: d.merchantId, name: d.name.trim(), price: price, days: d.days, sessions: d.sessions, category: d.category, desc: d.desc.trim(), jastip: jas, available: !!d.available, taxMode: d.taxMode || '' };
    if (d.newPhoto) payload.photo = d.newPhoto;
    else if (d.removePhoto) payload.photo = '';
    call = 'apiAdminSaveMenu'; msg = d.id ? 'Menu disimpan' : 'Menu ditambahkan';
  } else {
    var j = digits(d.jastip), pct = Number(String(d.taxPct).replace(',', '.'));
    if (j === '') e.jastip = 'Isi 0 jika jastip gratis.';
    if (d.taxOn && !(pct >= 0 && pct <= 100)) e.taxPct = ERR.TAX_INVALID;
    var npw = String(d.newPassword || '').trim();
    if (npw && (npw.length < 4 || npw.length > 32 || /\s/.test(npw))) e.newPassword = ERR.PASSWORD_INVALID;
    var su = String(d.shareUrl || '').trim();
    if (su && !/^https:\/\/\S+$/i.test(su)) e.shareUrl = ERR.URL_INVALID;
    payload = { jastip: j === '' ? 0 : j, taxOn: !!d.taxOn, taxPct: isFinite(pct) ? pct : 0, cutoffSiang: d.cutoffSiang || '', cutoffSore: d.cutoffSore || '', compress: d.compress, payInfo: d.payInfo.trim(), shareUrl: su, newPassword: npw };
    if (d.newQris) payload.qris = d.newQris;
    else if (d.removeQris) payload.qris = '';
    call = 'apiAdminSaveSettings'; msg = 'Pengaturan disimpan';
  }
  E.errs = e;
  if (Object.keys(e).length) { renderForm(); var f = $('#ovForm .field.bad .input'); if (f) f.focus(); return; }
  S.saving = true; renderForm();
  api(call, S.deviceId, S.adminPin, payload).then(function (r) {
    S.saving = false;
    if (!r || !r.ok) {
      if (adminExpired(r)) { toast(errText(r), 'err'); return; }
      var map = { NAME_REQUIRED: 'name', PRICE_INVALID: E.type === 'settings' ? 'jastip' : 'price', DAYS_REQUIRED: 'days', SESSION_REQUIRED: 'sessions', TAX_INVALID: 'taxPct', CUTOFF_INVALID: 'cutoffSiang', PASSWORD_INVALID: 'newPassword', URL_INVALID: 'shareUrl' };
      if (map[r.code]) E.errs[map[r.code]] = errText(r);
      renderForm(); toast(errText(r), 'err'); return;
    }
    if (E.type === 'menu' && r.id) {
      if (payload.photo) { PHOTO[r.id] = { v: r.photoV, d: payload.photo }; savePhotoCache(); }
      else if (payload.photo === '') { delete PHOTO[r.id]; savePhotoCache(); }
    }
    if (E.type === 'settings' && r.settings) {
      if (payload.qris) { S.qris = { v: r.settings.qrisV, d: payload.qris }; lsSet('tdp_qris', JSON.stringify(S.qris)); }
      S.config.qrisV = r.settings.qrisV;
      S.config.shareUrl = r.settings.shareUrl;
      if (r.passwordChanged) { S.adminPin = payload.newPassword; ssSet('santap_pin', payload.newPassword); msg = 'Pengaturan & password baru disimpan'; }
    }
    popOv('ovForm'); toast(msg);
    loadAdminCatalog(); reloadAll(true);
  }).catch(function () { S.saving = false; renderForm(); toast('Koneksi bermasalah', 'err'); });
}
function deleteMenu() {
  var d = S.edit.data;
  dialog({ title: 'Hapus menu?', text: '"' + d.name + '" akan dihapus dari semua hari. Pesanan lama tidak terpengaruh. Kalau hanya habis sementara, matikan "Tersedia" saja.', ok: 'Hapus', danger: true }).then(function (r) {
    if (!r.ok) return;
    api('apiAdminDeleteMenu', S.deviceId, S.adminPin, d.id).then(function (x) {
      if (!x || !x.ok) { if (!adminExpired(x)) toast(errText(x), 'err'); return; }
      popOv('ovForm'); toast('Menu dihapus'); loadAdminCatalog(); reloadAll(true);
    }).catch(function () { toast('Koneksi bermasalah', 'err'); });
  });
}
function catMerchant(id) { return S.admin.cat.merchants.filter(function (m) { return m.id === id; })[0]; }
function catMenu(id) { return S.admin.cat.menu.filter(function (m) { return m.id === id; })[0]; }

/* ===== DATA AWAL ===== */
function applyBoot(r, first) {
  S.config = r.config; S.mode = r.mode; S.isAdmin = !!r.isAdmin; S.appUrl = r.appUrl || '';
  S.cal = r.cal; S.cal.offset = r.cal.nowEpoch - Date.now();
  S.merchants = r.catalog.merchants; S.menu = r.catalog.menu;
  S.merMap = {}; S.menuMap = {};
  S.merchants.forEach(function (m) { S.merMap[m.id] = m; });
  S.menu.forEach(function (i) { S.menuMap[i.id] = i; });
  ensurePhotos(S.menu);
  S.user = r.user; S.orders = r.orders;
  S.form.name = S.form.name || S.user.name; S.form.phone = S.form.phone || S.user.phone;
  if (first || S.cal.days.indexOf(S.date) < 0 || sesKeys().indexOf(S.sess) < 0) {
    var savedD = ssGet('santap_date'), savedS = ssGet('tdp_sess');
    if (savedD && S.cal.days.indexOf(savedD) > -1 && sesKeys().indexOf(savedS) > -1) { S.date = savedD; S.sess = savedS; }
    else { var fo = firstOpen(); S.date = fo.date; S.sess = fo.sess; }
  }
  if (S.orderDate !== 'all' && S.cal.days.indexOf(S.orderDate) < 0) S.orderDate = S.cal.today;
  S.lastOpen = sesKeys().map(function (k) { return orderState(S.cal.today, k).ok ? 1 : 0; }).join('');
  sanitizeCarts();
  renderTopbar();
}
function reloadAll(silent) {
  return api('apiBootstrap', S.deviceId).then(function (r) {
    if (!r || !r.ok) { if (!silent) toast(errText(r), 'err'); return; }
    applyBoot(r, false);
    if (S.ov.indexOf('ovCheckout') > -1) { if (cartLines(S.date).length) renderCheckout(true); else popOv('ovCheckout'); }
    if (S.tab === 'home') renderHome();
    if (S.tab === 'orders' && !S.ov.length) renderOrders();
    if (S.ov[S.ov.length - 1] === 'ovOrder') renderOrderDetail();
    updateCartBar(); updateBadge();
  }).catch(function () {});
}
function showSkeleton() {
  $('#v-home').innerHTML = '<div class="home-head"><div class="sk" style="height:46px"></div></div>' +
    '<div style="display:flex;gap:8px;padding:0 16px"><div class="sk" style="height:52px;flex:1"></div><div class="sk" style="height:52px;flex:1"></div><div class="sk" style="height:52px;flex:1"></div></div>' +
    '<div class="groups">' + [1, 2, 3].map(function () { return '<div class="sk" style="height:150px"></div>'; }).join('') + '</div>';
}
function showBootError(r) {
  var msg = r && r.args && r.args.detail ? r.args.detail
    : (inGas() ? 'Periksa koneksi internetmu, lalu coba lagi.'
       : 'Tidak bisa terhubung ke server. Periksa koneksi internet. Jika tetap gagal, admin perlu memastikan API_URL di Index.html benar dan deployment Apps Script sudah versi terbaru.');
  $('#v-home').innerHTML = '<div class="empty"><div class="big">📡</div><h3>Gagal memuat data</h3><p>' + esc(msg) + '</p><button class="btn btn-primary" data-act="retry">Coba lagi</button></div>';
}
function boot() {
  showSkeleton();
  api('apiBootstrap', S.deviceId).then(function (r) {
    if (!r || !r.ok) { showBootError(r); return; }
    applyBoot(r, true); S.loaded = true;
    $('#v-home').innerHTML = '';
    renderHome(); renderOrders(); renderAccount(); updateCartBar(); updateBadge();
    var t = ssGet('santap_tab');
    if (t && /^(orders|account)$/.test(t)) switchTab(t, true);
  }).catch(function () { showBootError(null); });
}

/* ===== TOAST & DIALOG ===== */
var toastTimer;
function toast(msg, type) {
  var t = $('#toast');
  t.textContent = msg; t.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast' + (type === 'err' ? ' err' : ''); }, type === 'err' ? 4200 : 3000);
}
// opts: title, text, html (sudah aman), input {type,label,inputmode,placeholder,multiline}, ok, cancel (null = tanpa tombol batal), danger
function dialog(o) {
  return new Promise(function (resolve) {
    var d = $('#dlg'), prevFocus = document.activeElement;
    var inp = '';
    if (o.input) {
      inp = '<div class="field"><label for="dlgIn">' + esc(o.input.label || '') + '</label>' +
        (o.input.multiline
          ? '<textarea class="input" id="dlgIn" maxlength="200" placeholder="' + esc(o.input.placeholder || '') + '"></textarea>'
          : '<input class="input" id="dlgIn" type="' + (o.input.type || 'text') + '"' + (o.input.inputmode ? ' inputmode="' + o.input.inputmode + '"' : '') + ' autocomplete="' + esc(o.input.autocomplete || 'off') + '" placeholder="' + esc(o.input.placeholder || '') + '">') + '</div>';
    }
    d.innerHTML = '<div class="dlg-card" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">' + esc(o.title) + '</h3>' +
      (o.text ? '<p>' + esc(o.text) + '</p>' : '') + (o.html || '') + inp +
      '<div class="dlg-actions">' + (o.cancel === null ? '' : '<button class="btn" id="dlgNo">' + esc(o.cancel || 'Batal') + '</button>') +
      '<button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" id="dlgYes">' + esc(o.ok || 'Ya') + '</button></div></div>';
    d.hidden = false;
    var done = function (ok, alt) {
      var val = $('#dlgIn') ? $('#dlgIn').value.trim() : '';
      d.hidden = true; d.innerHTML = ''; document.removeEventListener('keydown', onKey);
      try { if (prevFocus) prevFocus.focus({ preventScroll: true }); } catch (e) {}
      resolve({ ok: ok, value: val, alt: !!alt });
    };
    var onKey = function (e) {
      if (e.key === 'Escape') done(false);
      if (e.key === 'Enter' && e.target && e.target.id === 'dlgIn' && e.target.tagName === 'INPUT') { e.preventDefault(); done(true); }
    };
    document.addEventListener('keydown', onKey);
    if ($('#dlgNo')) $('#dlgNo').onclick = function () { done(false, true); };
    $('#dlgYes').onclick = function () { done(true); };
    d.onclick = function (e) { if (e.target === d) done(false); };
    ($('#dlgIn') || $('#dlgNo') || $('#dlgYes')).focus();
  });
}

/* ===== EVENT ===== */
document.addEventListener('click', function (e) {
  var navBtn = e.target.closest('.nav-btn');
  if (navBtn) { switchTab(navBtn.getAttribute('data-tab')); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  var o, x, list, k;
  switch (act) {
    case 'back': popOv(S.ov[S.ov.length - 1]); break;
    case 'adminEntry': adminEntry(); break;
    case 'day': setDate(el.getAttribute('data-date')); break;
    case 'ses': setSess(el.getAttribute('data-s')); break;
    case 'goOpen': var fo = firstOpen(); S.date = fo.date; S.sess = fo.sess; ssSet('santap_date', fo.date); ssSet('tdp_sess', fo.sess); renderHome(); updateCartBar(); break;
    case 'cat': S.cat = el.getAttribute('data-cat'); renderChips(); renderMenuList(); break;
    case 'inc': changeQty(id, 1); break;
    case 'dec': changeQty(id, -1); break;
    case 'openCart': openCheckout(); break;
    case 'addMore': popOv('ovCheckout'); break;
    case 'place': placeOrder(); break;
    case 'goUnpaid': S.orderDate = 'all'; switchTab('orders'); break;
    case 'orderDate': S.orderDate = el.getAttribute('data-date'); renderOrders(); break;
    case 'openOrder': openOrder(id); break;
    case 'cancel': cancelOrder(id); break;
    case 'reorder': reorder(id); break;
    case 'refreshOrders': refreshOrders(false); break;
    case 'upload': startUpload(id); break;
    case 'viewProof': viewProof(id); break;
    case 'viewPic': viewPic(id); break;
    case 'copyAmt': o = orderById(id); if (o) copyText(String(o.total), 'Nominal ' + rp(o.total) + ' disalin'); break;
    case 'copyUrl': copyText(shareLink(), 'Link aplikasi disalin'); if ($('#appUrl')) $('#appUrl').select(); break;
    case 'platform': S.platform = el.getAttribute('data-p'); renderAccount(); break;
    case 'saveProfile': saveProfile(); break;
    case 'adminLogout': S.adminPin = ''; ssDel('santap_pin'); closeAllOverlays(); renderTopbar(); toast('Keluar dari mode admin'); break;
    case 'adminRefresh': if (S.admin.view === 'menu') loadAdminCatalog(); else loadAdmin(); break;
    case 'adminDate': S.admin.date = el.getAttribute('data-date'); S.admin.orders = []; loadAdmin(); break;
    case 'adminSes': S.admin.sess = el.getAttribute('data-s'); renderAdmin(); break;
    case 'adminView':
      var nv = el.getAttribute('data-v'), was = S.admin.view;
      S.admin.view = nv;
      if (nv === 'menu' && !S.admin.cat) loadAdminCatalog();
      else if (nv !== 'menu' && was === 'menu') loadAdmin();
      else renderAdmin();
      break;
    case 'adminFilter': S.admin.filter = el.getAttribute('data-f'); renderAdmin(); break;
    case 'payMark':
      o = adminOrder(id);
      dialog({ title: 'Tandai lunas?', text: (o ? o.name + ' · ' + rp(o.total) + '. ' : '') + 'Pastikan pembayarannya sudah masuk.', ok: 'Tandai lunas' }).then(function (d) {
        if (d.ok) adminUpdate(id, { status: 'Lunas' }, 'Ditandai lunas');
      });
      break;
    case 'payUndo':
      dialog({ title: 'Batalkan status lunas?', text: 'Status kembali ke Belum Bayar dan pemesan diminta upload ulang bukti bayar.', input: { label: 'Alasan', multiline: true, placeholder: 'Contoh: nominal kurang Rp2.000' }, ok: 'Kembalikan ke Belum Bayar', danger: true }).then(function (d) {
        if (d.ok) adminUpdate(id, { status: 'Belum Bayar', note: d.value || 'Bukti bayar tidak sesuai' }, 'Status kembali ke Belum Bayar');
      });
      break;
    case 'adminCancel':
      o = adminOrder(id);
      dialog({ title: 'Batalkan pesanan?', text: (o ? o.name + ' · ' + o.id + '. ' : '') + 'Pesanan akan ditandai batal.', ok: 'Batalkan pesanan', cancel: 'Tidak', danger: true }).then(function (d) {
        if (d.ok) adminUpdate(id, { status: 'Dibatalkan' }, 'Pesanan dibatalkan');
      });
      break;
    case 'menuDay': S.admin.day = el.getAttribute('data-d'); renderAdmin(); break;
    case 'menuSes': S.admin.mses = el.getAttribute('data-s'); renderAdmin(); break;
    case 'editSettings': openForm('settings', JSON.parse(JSON.stringify(S.admin.cat.settings))); break;
    case 'addMerchant': openForm('merchant', { id: '', name: '', emoji: '', desc: '', active: true, taxable: false }); break;
    case 'editMerchant': var cm = catMerchant(id); if (cm) openForm('merchant', JSON.parse(JSON.stringify(cm))); break;
    case 'addMenu':
      var dd = S.admin.day === 'all' ? [1, 2, 3, 4, 5] : [Number(S.admin.day)];
      var ss0 = S.admin.mses === 'all' ? [sesKeys()[0]] : [S.admin.mses];
      openForm('menu', { id: '', merchantId: id, name: '', price: '', days: dd, sessions: ss0, category: 'Makanan', desc: '', jastip: '', available: true, photoV: '', photo: '', taxMode: '' });
      break;
    case 'editMenu': var mi = catMenu(id); if (mi) openForm('menu', JSON.parse(JSON.stringify(mi))); break;
    case 'toggleDay':
      readFormInputs();
      x = Number(el.getAttribute('data-d')); list = S.edit.data.days; k = list.indexOf(x);
      if (k > -1) list.splice(k, 1); else list.push(x);
      delete S.edit.errs.days; renderForm(); break;
    case 'toggleSes':
      readFormInputs();
      x = el.getAttribute('data-s'); list = S.edit.data.sessions; k = list.indexOf(x);
      if (k > -1) list.splice(k, 1); else list.push(x);
      delete S.edit.errs.sessions; renderForm(); break;
    case 'setDays':
      readFormInputs();
      S.edit.data.days = el.getAttribute('data-p') === 'all' ? [0, 1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5];
      delete S.edit.errs.days; renderForm(); break;
    case 'saveForm': saveForm(); break;
    case 'deleteMenu': deleteMenu(); break;
    case 'pickPhoto': readFormInputs(); var pi = $('#photoInput'); pi.value = ''; pi.click(); break;
    case 'removePhoto': readFormInputs(); S.edit.data.newPhoto = ''; S.edit.data.removePhoto = true; renderForm(); break;
    case 'pickQris': readFormInputs(); var qi = $('#qrisInput'); qi.value = ''; qi.click(); break;
    case 'removeQris': readFormInputs(); S.edit.data.newQris = ''; S.edit.data.removeQris = true; renderForm(); break;
    case 'retry': boot(); break;
  }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') {
    clearTimeout(t._d);
    t._d = setTimeout(function () { S.q = t.value; renderMenuList(); }, 150);
    return;
  }
  var ef = t.getAttribute && t.getAttribute('data-ef');
  if (ef && S.edit && S.edit.errs[ef]) {
    delete S.edit.errs[ef];
    var fe = t.closest('.field'); if (fe) { fe.classList.remove('bad'); var er0 = $('.ferr', fe); if (er0) er0.remove(); }
  }
  var key = t.getAttribute && t.getAttribute('data-form');
  if (key) {
    S.form[key] = t.value;
    if (S.formErr[key]) {
      delete S.formErr[key];
      var f = t.closest('.field'); if (f) { f.classList.remove('bad'); var er = $('.ferr', f); if (er) er.remove(); }
    }
    ssSet('santap_draft', JSON.stringify({ name: S.form.name, phone: S.form.phone, note: S.form.note }));
  }
});
document.addEventListener('change', function (e) {
  var t = e.target, f;
  if (t.id === 'proofInput') { onProofPicked(t.files && t.files[0]); return; }
  if (t.id === 'photoInput') {
    f = t.files && t.files[0];
    if (!f || !S.edit || S.edit.type !== 'menu') return;
    if (f.type && !/^image\//.test(f.type)) { toast('Pilih file gambar (JPG atau PNG).', 'err'); return; }
    if (f.size > 20 * 1024 * 1024) { toast('Foto lebih dari 20 MB. Pilih foto lain.', 'err'); return; }
    cropSquare(f).then(function (d) {
      S.edit.data.newPhoto = d; S.edit.data.removePhoto = false; renderForm();
    }).catch(function () { toast('Foto tidak bisa diproses. Coba foto lain.', 'err'); });
    return;
  }
  if (t.id === 'qrisInput') {
    f = t.files && t.files[0];
    if (!f || !S.edit || S.edit.type !== 'settings') return;
    if (f.type && !/^image\//.test(f.type)) { toast('Pilih file gambar QRIS (JPG atau PNG).', 'err'); return; }
    prepQris(f).then(function (d) {
      S.edit.data.newQris = d; S.edit.data.removeQris = false; renderForm();
    }).catch(function () { toast('Gambar QRIS tidak bisa diproses. Coba file lain.', 'err'); });
    return;
  }
  if (t.name === 'cmp' && S.edit) { readFormInputs(); renderForm(); return; }
  // Ganti kategori -> pratinjau gambar default ikut berubah
  if ((t.id === 'nfCat' || t.id === 'nfMer') && S.edit) { readFormInputs(); renderForm(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'q') e.target.blur();
});

// Saat keyboard HP terbuka, sembunyikan bottom nav agar tidak menutupi form.
if (window.visualViewport) {
  var baseH = window.innerHeight;
  window.visualViewport.addEventListener('resize', function () {
    document.body.classList.toggle('kb', window.visualViewport.height < baseH * 0.75);
  });
  window.addEventListener('orientationchange', function () { setTimeout(function () { baseH = window.innerHeight; }, 400); });
}

// Tombol back browser/HP mengikuti tab (bila didukung GAS).
try {
  if (google.script.history) google.script.history.setChangeHandler(function (ev) {
    var t = ev && ev.state && ev.state.tab;
    if (t && /^(home|orders|account)$/.test(t) && t !== S.tab) switchTab(t, true);
  });
} catch (e) {}

// Pembaruan berkala: ganti hari dan jam tutup sesi.
function tick() {
  if (!S.loaded || document.visibilityState !== 'visible') return;
  if (S.cal.nextDayEpoch && serverNow() >= S.cal.nextDayEpoch) { reloadAll(true); return; }
  var open = sesKeys().map(function (k) { return orderState(S.cal.today, k).ok ? 1 : 0; }).join('');
  if (open !== S.lastOpen) {
    S.lastOpen = open;
    if (S.tab === 'home' && !S.ov.length) renderHome();
    if (S.ov.indexOf('ovCheckout') > -1 && S.date === S.cal.today) renderCheckout(true);
    updateCartBar();
  }
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') tick(); });

/* ===== INIT ===== */
S.deviceId = loadDeviceId();
S.adminPin = ssGet('santap_pin') || '';
loadCarts();
try {
  var d0 = JSON.parse(ssGet('santap_draft') || 'null');
  if (d0) { S.form.name = d0.name || ''; S.form.phone = d0.phone || ''; S.form.note = d0.note || ''; }
} catch (e) {}
boot();

})();
</script>
